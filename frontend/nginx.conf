server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy (Docker network orqali)
    location /api/ {
        proxy_pass http://backend:9060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /users/ {
        proxy_pass http://backend:9060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MinIO bucket proxy (rasm URL lari)
    location /user-profile/ {
        proxy_pass http://minio:9000/user-profile/;
        proxy_set_header Host minio:9000;
    }

    location /generic-images-bucket/ {
        proxy_pass http://minio:9000/generic-images-bucket/;
        proxy_set_header Host minio:9000;
    }

    location /furniture-images/ {
        proxy_pass http://minio:9000/furniture-images/;
        proxy_set_header Host minio:9000;
    }

    client_max_body_size 20M;
}
