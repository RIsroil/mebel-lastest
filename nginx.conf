server {
    listen 80;
    server_name m-house.uz www.m-house.uz;

    # Frontend — React build (dist papkasi)
    root /var/www/mebel/frontend/dist;
    index index.html;

    # React Router uchun — barcha yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://localhost:9060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /users/ {
        proxy_pass http://localhost:9060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MinIO bucket larni proxy qilish (rasm URL lari uchun)
    # app.base-url + /bucket-name/... formatidagi URL lar shu yerdan o'tadi
    location /user-profile/ {
        proxy_pass http://localhost:9000/user-profile/;
        proxy_set_header Host localhost:9000;
    }

    location /generic-images-bucket/ {
        proxy_pass http://localhost:9000/generic-images-bucket/;
        proxy_set_header Host localhost:9000;
    }

    location /furniture-images/ {
        proxy_pass http://localhost:9000/furniture-images/;
        proxy_set_header Host localhost:9000;
    }

    # Katta fayllar uchun (rasm yuklash)
    client_max_body_size 20M;
}
