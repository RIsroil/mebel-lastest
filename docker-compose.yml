services:

  postgres:
    image: postgres:16-alpine
    container_name: mebel_postgres
    restart: always
    environment:
      POSTGRES_DB: mebel_lastest
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mebel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d mebel_lastest"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mebel_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9001:9001"   # MinIO admin panel (ixtiyoriy, kerak bo'lmasa o'chirishingiz mumkin)
    volumes:
      - minio_data:/data
    networks:
      - mebel_net

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/risroil/mebel-backend:latest}
    container_name: mebel_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      # Docker network ichida service nomlari ishlatiladi (localhost emas!)
      DB_URL: jdbc:postgresql://postgres:5432/mebel_lastest
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXP: ${ACCESS_TOKEN_EXP}
      REFRESH_TOKEN_EXP: ${REFRESH_TOKEN_EXP}
      STORAGE_MODE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - mebel_net

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/risroil/mebel-frontend:latest}
    container_name: mebel_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mebel_net

networks:
  mebel_net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
