spring.application.name=mebel

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mebel_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.base-url=${APP_BASE_URL:http://localhost:1001}
#frontend.url=${FRONTEND_URL:http://localhost:3000}
# Liquibase
spring.liquibase.change-log= classpath:db/changelog/master.xml

secret-key=${JWT_SECRET:2lVo5TcjgTco3dUIwmYEIWcLfeiBR7QgjS9fFyn1Jdg}
access-token-exp=${ACCESS_TOKEN_EXP:3024000000}
refresh-token-exp=${REFRESH_TOKEN_EXP:6048000000}

storage.mode=${STORAGE_MODE:local}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}

minio.bucket.userprofile=user-profile
minio.bucket.generic-images=generic-images-bucket

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
spring.messages.fallback-to-system-locale=false

server.port=9060